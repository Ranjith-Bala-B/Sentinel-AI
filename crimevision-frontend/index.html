<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel AI — Karnataka State Police</title>
    <meta name="description" content="AI-driven crime analytics and intelligence platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Hide Google Translate top banner iframe visually offscreen without disabling translation */
      .goog-te-banner-frame,
      iframe.goog-te-banner-frame,
      .goog-te-banner,
      .VIpgm-bNvd2c-AgptSc-gT32le-hSRLqb,
      .VIpgm-bNvd2c-AgptSc-hSRLqb,
      iframe[id*=":1.container"],
      iframe[id*=":0.container"],
      iframe[src*="translate.google"] {
        visibility: hidden !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        height: 0px !important;
        width: 0px !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
      body {
        top: 0px !important;
        position: static !important;
        margin-top: 0px !important;
      }
      .goog-te-gadget {
        display: none !important;
      }
      .goog-tooltip, .goog-tooltip:hover {
        display: none !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body class="bg-base-950 text-base-200 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
